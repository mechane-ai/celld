name: Build reviewed native celld candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full source commit to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-candidate-${{ inputs.source_commit }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.98.1

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Verify reviewed source
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Prepare upstream toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'

      - name: Run retained compatibility checks
        run: |
          set -euo pipefail
          mkdir -p out
          {
            cargo test --release --locked -p celld --test node_net
            cargo test --release --locked -p celld --lib js::tcp::tests
            cargo test --release --locked -p celld-logic --lib gate::tests
          } 2>&1 | tee out/rust-tests.log

      - name: Build ordinary release profile
        run: |
          set -euo pipefail
          cargo build --release --locked
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/celld/Cargo.toml | head -1)
          reported=$(target/release/celld --version)
          printf 'Expected version: celld %s\nReported version: %s\n' "$version" "$reported"
          test "$reported" = "celld $version"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1

      - name: Check storage transactions on candidate bytes
        run: |
          set -euo pipefail
          npm exec --yes --package=esbuild@0.25.12 -- \
            node crates/celld/tests/storage_transactions.mjs target/release/celld \
            2>&1 | tee out/storage-transactions.log

      - name: Check TCP and R2 resource ownership on candidate bytes
        run: |
          set -euo pipefail
          npm exec --yes --package=esbuild@0.25.12 -- \
            node crates/celld/tests/tcp_ownership.mjs target/release/celld \
            2>&1 | tee out/tcp-ownership.log

      - name: Check Docker runtime on candidate bytes
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          npm exec --yes --package=esbuild@0.25.12 -- \
            node crates/celld/tests/container_images.mjs target/release/celld \
            2>&1 | tee out/container-images.log
          npm exec --yes --package=esbuild@0.25.12 -- \
            node crates/celld/tests/container_inspect.mjs target/release/celld \
            2>&1 | tee -a out/container-images.log

      - name: Package exact bytes and input manifest
        env:
          CELLD_TARGET: ${{ matrix.target }}
          CELLD_RUNNER: ${{ matrix.runner }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          mkdir -p out
          gzip -9 -n -c target/release/celld > "out/celld-$CELLD_TARGET.gz"
          cp LICENSE NOTICE out/
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          def digest(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          target = os.environ['CELLD_TARGET']
          archive = f'out/celld-{target}.gz'
          manifest = {
              'sourceCommit': command('git', 'rev-parse', 'HEAD'),
              'sourceTree': command('git', 'rev-parse', 'HEAD^{tree}'),
              'sourceClean': not command('git', 'status', '--porcelain', '--untracked-files=no'),
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflowCommit': os.environ['GITHUB_SHA'],
              'workflowRun': os.environ['GITHUB_RUN_ID'],
              'target': target,
              'runner': os.environ['CELLD_RUNNER'],
              'runnerImage': os.environ.get('ImageVersion'),
              'operatingSystem': platform.platform(),
              'compiler': command('rustc', '-Vv'),
              'cargo': command('cargo', '-V'),
              'runtimeCheckTools': {'node': command('node', '--version'), 'npm': command('npm', '--version'), 'esbuild': '0.25.12', 'openssl': command('openssl', 'version')},
              'cargoLockSHA256': digest('Cargo.lock'),
              'profile': 'release',
              'buildCommand': 'cargo build --release --locked',
              'reportedVersion': command('target/release/celld', '--version'),
              'binarySHA256': digest('target/release/celld'),
              'archive': pathlib.Path(archive).name,
              'archiveSHA256': digest(archive),
              'licenseSHA256': digest('LICENSE'),
              'noticeSHA256': digest('NOTICE'),
              'packagingCommand': 'gzip -9 -n -c target/release/celld',
              'checks': [
                  {'name': 'retained Rust compatibility cases', 'outcome': 'passed', 'evidence': 'rust-tests.log', 'evidenceSHA256': digest('out/rust-tests.log')},
                  {'name': 'concurrent storage transactions on candidate bytes', 'outcome': 'passed', 'evidence': 'storage-transactions.log', 'evidenceSHA256': digest('out/storage-transactions.log')},
                  {'name': 'TCP connect, startTLS and R2 body resource ownership on candidate bytes', 'outcome': 'passed', 'evidence': 'tcp-ownership.log', 'evidenceSHA256': digest('out/tcp-ownership.log')},
              ],
              'publication': 'not published; CI candidate artifact only',
          }
          assert manifest['sourceCommit'] == os.environ['EXPECTED_COMMIT']
          assert manifest['sourceClean']
          if target.endswith('-linux-gnu'):
              manifest['runtimeCheckTools']['docker'] = command('docker', 'version', '--format', '{{.Server.Version}}')
              manifest['checks'].append({'name': 'Docker image and live container identities on candidate bytes', 'outcome': 'passed', 'evidence': 'container-images.log', 'evidenceSHA256': digest('out/container-images.log')})
          pathlib.Path(f'out/manifest-{target}.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Attest exact candidate archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/*.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: celld-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

      - name: Retain unqualified failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unqualified-failure-${{ matrix.target }}
          path: |
            out/*.log
            target/release/celld
            LICENSE
            NOTICE
          if-no-files-found: warn
